# Apache Guacamole configuration — reference copy.
#
# The official guacamole/guacamole Docker image GENERATES this file at start
# from environment variables, so the containers in docker-compose.yml /
# compose.media.yml do not read this copy. It documents what those env vars
# produce, and is the file to install by hand on a non-Docker Tomcat.

# ── Database authentication (the connections admins manage) ───────────────
postgresql-hostname: guac_db
postgresql-port: 5432
postgresql-database: guacamole_db
postgresql-username: guacamole_user
# postgresql-password: set via POSTGRESQL_PASSWORD

# ── guacd ─────────────────────────────────────────────────────────────────
guacd-hostname: guacd
guacd-port: 4822

# ── JSON authentication (Phase 5 — join tickets) ──────────────────────────
# Enables guacamole-auth-json. FastAPI signs and encrypts a one-connection
# auth document with this key and hands it to the worker's browser, which
# POSTs it to /api/tokens. Guacamole decrypts it and issues a token that can
# see nothing but that single connection — so workers never need a Guacamole
# login of their own (Principle 6).
#
# 128-bit key as 32 hex characters. Must equal GUACAMOLE_JSON_SECRET_KEY in
# backend/.env. Generate with:
#   python -c "import secrets; print(secrets.token_hex(16))"
# Docker env var: JSON_SECRET_KEY
json-secret-key: CHANGE_ME_32_HEX_CHARACTERS_HERE

# Deliberately NOT set: json-trusted-networks.
# The auth document is POSTed by each worker's own browser, from addresses we
# cannot enumerate. The single-use join-ticket check in Nginx
# (infrastructure/nginx/guacamole-join-ticket.conf) is the gate instead.
