# Guacamole public vhost hardening (Phase 1 Safety)
# Include inside the guac.* server { } block, BEFORE "location /".
#
# Blocks public Guacamole REST that can list connections and dump
# hostname/username/password when a guacadmin token is presented.
# Keep websocket-tunnel and the HTML client reachable.
#
# Apply on the VPS:
#   1. Copy the location blocks below into workforce-platform.conf
#      (guac server block), or include this file if your layout allows.
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. Rotate GUACAMOLE_PASSWORD / guacadmin in Guacamole + backend .env
#      (assume any previously leaked token is burned).

# Deny connection CRUD / parameter reads from the public internet.
location ~* ^/api/session/data/[^/]+/connections {
    return 404;
}

location ~* ^/api/session/data/[^/]+/activeConnections {
    return 404;
}

location ~* ^/api/session/data/[^/]+/users {
    return 404;
}

location ~* ^/api/session/data/[^/]+/userGroups {
    return 404;
}

# Token minting stays available for the Guacamole login UI and for
# FastAPI on the private side. Prefer hitting Tomcat from localhost
# for the API (GUACAMOLE_URL=http://127.0.0.1:8080/guacamole).
