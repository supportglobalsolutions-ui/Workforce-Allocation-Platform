# Dual FastAPI upstream (Phase 7 control-plane redundancy)
#
# Paste into the api.* server block of workforce-platform.conf, replacing the
# single proxy_pass to 127.0.0.1:8000 for normal API traffic. Keep the dedicated
# ws-tunnel location if the legacy Python tunnel is still in use.

upstream workforce_api {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    # Second control host on the private network:
    # server 10.0.0.21:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Example location / (API JSON):
#   proxy_pass http://workforce_api;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#
# WebSocket tunnel (if still used) should pin to one backend or use ip_hash:
#   upstream workforce_api_ws {
#       ip_hash;
#       server 127.0.0.1:8000;
#       server 10.0.0.21:8000;
#   }
