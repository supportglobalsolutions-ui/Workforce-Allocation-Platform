# Guacamole join-ticket gate (Phase 5 Action 2 — Guacamole auth integration)
#
# What this does
# --------------
# Workers open the desktop canvas directly against guac.* so pixels stop
# flowing through FastAPI. The only way to get a Guacamole token is to spend a
# short-lived, single-use join ticket that FastAPI issued for an open claim:
#
#   1. Browser: POST /rdp/{id}/join-ticket   (api.*)  -> ticket + encrypted auth blob
#   2. Browser: POST /api/tokens?rdp_ticket= (guac.*) -> Guacamole token
#        Nginx first asks FastAPI whether that ticket is good, and FastAPI
#        burns it. guacamole-auth-json then scopes the token to exactly the
#        one connection named in the blob.
#   3. Browser: wss /websocket-tunnel        (guac.*) -> pixels
#
# No worker ever holds a guacadmin login (Principle 6), and a ticket is
# useless for a different machine, a different worker, or a session that has
# already ended.
#
# Install
# -------
#   1. Put the `map` block at http{} level (e.g. in /etc/nginx/conf.d/), and
#      the `location` blocks inside the guac.* server{} block BEFORE
#      "location /". They sit alongside the Phase 1 blocks in
#      guacamole-hardening.conf.
#   2. Set the real app origins in the map below.
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# TRADE-OFF, read before applying: this makes /api/tokens on the PUBLIC guac.
# host reachable only with a valid join ticket, which also blocks the
# Guacamole admin login screen from the internet. That is deliberate and
# consistent with Phase 1 — administer Guacamole over an SSH tunnel instead:
#
#   ssh -L 8080:127.0.0.1:8080 deployer@<vps>   # then http://localhost:8080/guacamole


# ── http{} level ──────────────────────────────────────────────────────────
# Echo back only origins we actually serve the app from. A bare wildcard here
# would let any site mint tokens with a stolen ticket.
map $http_origin $guac_cors_origin {
    default                      "";
    "https://www.gsdeck.com"     $http_origin;
    "https://gsdeck.com"         $http_origin;
    # Add the Vercel preview origin here if pilots test from one.
}

# On a split media VPS, replace 127.0.0.1 with the control VPS's private IP.
# Keep this upstream private; it is the ticket authority, not a public API route.
upstream workforce_control_api {
    server 127.0.0.1:8000;
}


# ── inside the guac.* server{} block ──────────────────────────────────────

# Internal only: never routable from the internet. Nginx calls this to ask
# FastAPI "is this ticket good?", and the call itself spends the ticket.
location = /_rdp_join_check {
    internal;

    # Point at FastAPI. For media/control split deployments, this uses the
    # private upstream declared above and never re-enters the public api. vhost.
    proxy_pass              http://workforce_control_api/rdp/gateway/verify-ticket;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";

    # auth_request subrequests carry no query of their own, so hand FastAPI
    # the URI being authorised and let it read rdp_ticket out of it.
    proxy_set_header        X-Original-URI $request_uri;

    # This gateway names itself. A join ticket is minted for one media node;
    # redeemed at another, the session would run on a gateway the control plane
    # is not tracking, so a later force-stop would query the wrong node, find
    # nothing, and release the machine with a live tunnel still up.
    #
    # MUST match the "id" for this host in RDP_GATEWAYS. On a single-gateway
    # deployment leave it as "default" (or omit the header entirely — FastAPI
    # only enforces a match when the header is present).
    proxy_set_header        X-Gateway-Id "default";

    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;

    # A slow control plane must not hang the connect.
    proxy_connect_timeout   3s;
    proxy_read_timeout      5s;
}

# Token minting — the one gate in front of the media plane.
location = /api/tokens {
    auth_request /_rdp_join_check;

    # The canvas is served from the app origin, so this mint is cross-origin.
    # The request stays CORS-safelisted (form POST, ticket in the query), so
    # there is no preflight to answer — only the response needs to be
    # readable by the app origin.
    add_header Access-Control-Allow-Origin $guac_cors_origin always;
    add_header Vary Origin always;

    proxy_pass         http://127.0.0.1:8080/guacamole/api/tokens;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Pixels. Left open on purpose: the Guacamole token minted above is the
# credential here, and guacamole-auth-json has already limited it to one
# connection. Long timeouts because a desktop session is a long-lived socket.
location = /websocket-tunnel {
    proxy_pass         http://127.0.0.1:8080/guacamole/websocket-tunnel;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
