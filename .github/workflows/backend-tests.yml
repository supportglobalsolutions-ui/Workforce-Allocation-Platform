name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workforce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforce_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/workforce_test
      ENVIRONMENT: test
      GUACAMOLE_PUBLIC_URL: https://guac.test.invalid
      RDP_DIRECT_GATEWAY_MODE: "on"
    steps:
      - uses: actions/checkout@v4
      # Ephemeral test key only — never a production secret, never committed.
      - name: Mint throwaway Guacamole JSON test key
        run: echo "GUACAMOLE_JSON_SECRET_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest
