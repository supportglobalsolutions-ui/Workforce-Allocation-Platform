[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Intentionally blank — migrations/env.py reads DATABASE_URL from the
# environment (backend/.env) and sets this at runtime. Never hardcode a
# credential here; this file is committed.
#
# Supabase note: run migrations against the DIRECT connection or the SESSION
# pooler, never the transaction pooler on :6543 — DDL and transactional
# migrations misbehave through pgbouncer's transaction mode.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
