[pytest]
testpaths = tests
python_files = test_*.py
# Keep output quiet enough to read a failure at a glance.
addopts = -q --strict-markers
markers =
    postgres: needs a real PostgreSQL (the enum/UUID column types do not exist
        in SQLite). Skipped automatically when psycopg2 or DATABASE_URL_TEST is
        unavailable; CI provides Postgres as a service.
